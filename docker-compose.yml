# CloudSentinel with PostgreSQL persistence and Prometheus monitoring.
#
#   cp .env.example .env   # then set POSTGRES_PASSWORD and EXPORTER_DB_PASSWORD
#   docker compose up --build
#
# Prometheus UI: http://127.0.0.1:9090 (bound to localhost only).
#
# The migrations in ./migrations run automatically the first time the
# postgres volume is initialised (empty volume only).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudsentinel}
      POSTGRES_DB: ${POSTGRES_DB:-cloudsentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # Read by migrations/002_exporter_role.sql during first-run init.
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD:?set EXPORTER_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: during first-run init postgres listens on the unix
      # socket only, so this stays unhealthy until migrations have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  scanner:
    build: .
    image: cloudsentinel:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The password is passed via PGPASSWORD (read by libpq) rather than
      # embedded in the URL, so it never appears in DATABASE_URL.
      DATABASE_URL: postgresql://${POSTGRES_USER:-cloudsentinel}@postgres:5432/${POSTGRES_DB:-cloudsentinel}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # Cloud credentials are passed through from the host environment.
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
      AWS_DEFAULT_REGION:
      AWS_PROFILE:
    volumes:
      - ./reports:/app/reports
    command: ["--cloud", "aws", "--diff"]

  exporter:
    build: ./exporter
    image: cloudsentinel-exporter:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Connects as the read-only role from migrations/002, not the owner.
      DATABASE_URL: postgresql://cloudsentinel_exporter@postgres:5432/${POSTGRES_DB:-cloudsentinel}
      PGPASSWORD: ${EXPORTER_DB_PASSWORD:?set EXPORTER_DB_PASSWORD}
    # No ports: Prometheus scrapes exporter:9187 on the compose network, so
    # the metrics endpoint is not reachable from the host.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    depends_on:
      - exporter
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

volumes:
  pgdata:
  promdata:
